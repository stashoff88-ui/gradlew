name: Build mod

# Builds the Francisek Client Fabric mod jar automatically on every push, and lets you
# download the compiled .jar from the "Actions" tab of this repo - no local Java/Gradle
# install needed. See the "Artifacts" section at the bottom of a finished run.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload built mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: francisekclient-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Upload full build reports (only on failure, for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/
          if-no-files-found: ignore
